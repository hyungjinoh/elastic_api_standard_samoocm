#######################################################################
# 공통(base) 설정
#
# [활성 프로파일 기본값]
#  - 프로파일을 별도로 지정하지 않고 실행하면(예: IntelliJ에서 그냥 Run) 기본으로 local 이 활성화된다.
#  - 이 값이 없으면 어떤 application-*.yml 도 로드되지 않아 log.path 등 프로파일 설정이 비어,
#    logback 이 로그를 ./logs(기본값) 로만 남기고 DB/ES 접속정보도 로드되지 않는다.
#  - 운영/개발 서버는 start.sh 에서 --spring.profiles.active=$SERVER_ENV 로 명시 지정하므로
#    (또는 SPRING_PROFILES_ACTIVE 환경변수) 이 기본값보다 항상 우선한다. 즉 이 기본값은 로컬 편의용이며
#    운영 동작에는 영향을 주지 않는다.
#######################################################################
spring:
  profiles:
    active: local
