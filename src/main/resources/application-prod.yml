#######################
# Server
#######################
server:
  port: 8002
  tomcat:
    uri-encoding: UTF-8
  ssl:
    enabled: true
    key-store: file:/prod/search_api/ssl/search-api.p12  # 실제 사용하는 p12파일 사용해야함.
    key-store-type: PKCS12
    # @search!
    key-store-password: ENC(0Whq7L+cSk3iL67TMoLaRIQPV4OuTqbs)
#######################
# Database
#######################
mybatis:
  mapper-locations: /mapper/**/*.xml
jasypt:
  encryptor:
    bean: jasyptEncryptorAES

spring:
  mvc:
    pathmatch:
      matching-strategy: ant-path-matcher

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://10.214.122.94:3306/isearch?allowPublicKeyRetrieval=true&useSSL=false
    # JasyptAesConfig 의 stringEncryptor함수를 활용해 생성
    username: ${DB_USERNAME}
    # JasyptAesConfig 의 stringEncryptor함수를 활용해 생성
    password: ${DB_PASSWD}

    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      idle-timeout: 600000
      connection-timeout: 10000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      leak-detection-threshold: 5000   # 커넥션 누수 감지 (선택)
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true

  task:
    execution:
      pool:
        core-size: 20
        max-size: 50
        queue-capacity: 100

#######################
# Logging
#######################
log:
  path: /applog/search_api
  name: search

logging:
  level:
    com.rayful.elastic.api: DEBUG

#######################
# Elasticsearch
#######################
elasticsearch:
  host: 'https://10.214.122.94:9200'

#######################
# Webclient
#######################
webclient:
  max-connections: 100
  max-idle-time: 60
  max-life-time: 60
  pending-acquire-timeout: 5000
  pending-acquire-maxCount: -1
  evict-in-background: 30
  metrics: false
  # 3000 -> 10000
  connection-timeout: 10000
  # 3000 -> 15000
  response-timeout: 15000
  # 3000 -> 15000
  read-timeout: 15000
  # 3000 -> 15000
  write-timeout: 15000
  max-in-memory-size: 100
  ssl:
    key-store-path: file:/app/search_api/ssl/elasticjks
    # @search!
    key-store-pwd: ${KEY_STORE_PWD}
    # [고객사 변경] 은행 폐쇄망 전제(trust-self-signed: false, 정식 인증서 검증)에서
    # 일반 회사 환경으로 바뀌면서 local 과 동일하게 자체서명 인증서 허용으로 전환.
    trust-self-signed: true
    #header-id-pw: ENC(JlWuhVIe8FK+0FSTX36QMoCsrHB1756y)
    # M0dhdks1Z0JkS3pybVdpWVVXSFY6MWpLQktydkxTdHFQN2dSQTF3WU9CQQ==
    header-api-key: SVF5dk1Kd0I0YkZ4dDVLOC1KQjI6ZXNNSHY0WmxSbmVPeG9vZ2k2THd5dw==

#######################
# Search API
#######################
search:
  # 메뉴 검색 동의어 인덱스명 (CommonServiceImpl.getSynonymKeywordList()에서 사용)
  menu-synonym-index: idx_09_menu_syno
  # 통합검색 시 인덱스(섹션)당 미리보기 노출 개수 - UI가 "위에서 아래로 3개씩" 보여주는 구조에 맞춤
  integrated-preview-size: 3
  # Product Info
  product-info:
    prdname: RAY.Search V2025.08
    name: RAY.Search.API
    version: "2025.08"
    #buildtime: "2025-08-11T05:20:42Z"
    buildtime: "@maven.build.timestamp@"
    timezone: Asia/Seoul
  # API 키
  # 5f275eb1149f3eafddc000c80406d861749eb2d2506fcbcd60743f902b0ed351
  api-key:
    - ENC(xkszGt5rWpSFNm0wl0Rq8qGnB5uw4OH0aLhjxXfGjYowPRzrD6eLDMBDFytbZlDMEMbnwgrBq3uRWWN2PGxz1PzhFUIArvECk3UcODUB1vo=)
  # 요청 허용 ip
  allow-ip:
    use: N
    ip:
      - 192.168.10.106
  # 검색어의 DB Insert 여부 - DB가 제공되지 않는 사이트에서는 N 처리, N일 경우 spring.jpa.hibernate.ddl-auto: none 설정을 하도록 한다.
  dblog-use: Y
  # 사이트정보(현재 미사용)
  site-info:
    name: 이화다이아몬드
    code: DEFAULT
  # 인덱스명 : 99999는 통합검색, 인덱스명은 아래 섹션명과 matching
  index-name:
    "99999": idx_02_boards,idx_02_notices,idx_02_files
    "80000": idx_08_menus
    "20000": idx_02_boards
    "30000": idx_02_notices
    "40000": idx_02_files
    "90000": idx_auto
  # 섹션코드 : 인덱스명 기준으로 섹션코드 지정(고정 코드값)
  section-code:
    idx_08_menus: 80000
    idx_02_boards: 20000
    idx_02_notices: 30000
    idx_02_files: 40000
    idx_auto: 90000
  # 섹션명 : 인덱스명 기준으로 섹션명 지정(사이트 별 수정 가능)
  section-name:
    idx_08_menus: 메뉴검색
    idx_02_boards: 게시판
    idx_02_notices: 공지사항
    idx_02_files: 문서파일
    idx_auto: 자동완성
  # 검색결과 리턴필드 : 인덱스명 기준(현재 기본필드만 지정, 사이트 별 수정 가능)
  # attach_body 의 경우 사이즈가 너무 큰 이슈가 존재 하므로 _source로 제공하지 않고, 하이라이팅이 존재 할 경우 해당 정보만 리턴
  includes:
    idx_08_menus: docid,title,url_link,collapse_cd,lv1_mId,lv2_mId,lv3_mId,lv1_mNm,lv2_mNm,lv3_mNm,amsysTrnScrId,amsysMenuHdnYn,amsysMenuId,amsysBizCfcd,amsysBizDtlsClfId
    idx_02_boards: docid,title,url_link,content,category_full,writer_nm,writer_dept,reg_dtm,upd_dtm,collapse_cd,blbrId,blbrDtlId
    idx_02_notices: docid,title,url_link,content,category_full,writer_nm,writer_dept,reg_dtm,upd_dtm,collapse_cd,blbrId,blbrDtlId
    idx_02_files: docid,title,url_link,category_full,category_cur,updator_nm,updator_dept,writer_nm,writer_dept,reg_dtm,upd_dtm,collapse_cd,amsysAtflId,atflSrno,amsysAtflPhscNm,amsysAtflLcaTxtm,amsysAtflId,fileOpblYN,fileType,mstUsgYN,fileUsgYN
    idx_auto: word
  # 검색 필드 : 인덱스명 기준(AREA01-전체, AREA02-제목, AREA03-본문, AREA04-첨부, AREA05-기안자(작성자), AREA06-완결자, 사이트 별 수정 가능)
  fields:
    idx_08_menus:
      AREA01: title
      AREA02: title
      AREA03: title
      AREA04: title
      AREA05: title
    idx_02_boards :
      AREA01: title,content,writer_nm
      AREA02: title
      AREA03: content
      AREA04: attach_info.attach_nm,attach_body
      AREA05: writer_nm,writer_nm.ngram
    Idx_02_notices :
      AREA01: title,content,writer_nm
      AREA02: title
      AREA03: content
      AREA04: attach_info.attach_nm,attach_body
      AREA05: writer_nm,writer_nm.ngram
    idx_02_document:
      AREA01: title,content,attach_info.attach_nm,attach_body,writer_nm,writer_nm.ngram,doc_number,category_cur,category_full
      AREA02: title
      AREA03: content
      AREA04: attach_info.attach_nm,attach_body
      AREA05: writer_nm,writer_nm.ngram
    idx_02_files:
      AREA01: title,writer_nm,writer_nm.ngram
      AREA02: title
      AREA03: content
      AREA04: attach_info.attach_nm,attach_body
      AREA05: writer_nm,writer_nm.ngram
    idx_auto:
      AREA01: word,word.cho,word.engram,word.ngram,word.keyword
      #상세검색없음, 어떤것을 선택하던 전체와 동일하게 선택되도록 설정, 추후 다르게 설정하고프면 변경필요
      AREA02: word,word.cho,word.engram,word.ngram,word.keyword
      AREA03: word,word.cho,word.engram,word.ngram,word.keyword
      AREA04: word,word.cho,word.engram,word.ngram,word.keyword
      AREA05: word,word.cho,word.engram,word.ngram,word.keyword
  # 하이라이트 필드 : 인덱스 기준으로 필드 지정, 지정된 필드에 한해 highlight-sub 옵션에서 활용될 수 있음.
  # "필드.ngram", "필드.cho" 같은 필드도 지정하면 검색엔진에 해당 명칭으로 리턴 되며, 소스레벨에서 "필드"로 replace 처리, 단 "필드"에 하이라이트 값이 있다면 무시처리 (ex. title.ngram)
  # 배열구조 색인인 경우에도 지정하면 해당 명칭으로 리턴 되며, 소스레벨에서 배열구조 안에 replace 처리 (ex. attach_info.attach_nm)
  highlight:
    idx_08_menus: title
    idx_02_boards: title,content,writer_nm,doc_number,category_cur
    idx_02_notices: title,content,writer_nm,doc_number,category_cur
    idx_02_files: title,content,writer_nm,doc_number,category_cur
    idx_auto: word,word.cho,word.engram,word.ngram
  # 추가 하이라이트 필드 : 인덱스명 기준, 추가로 _highlight 가 붙은 결과를 제공한다.(다른 필드는 기존 필드명에 overwrite 된다.)
  # attach_body 의 경우 서브필드를 강제적으로 제공하도록 처리(includes에서 제거된 상태로 고정)
  highlight-sub:
    idx_01_edms: content,attach_info.attach_nm
    idx_02_eapproval: content,attach_info.attach_nm
    idx_02_boards: content,attach_info.attach_nm
    idx_02_document: content,attach_info.attach_nm
    idx_03_people:
    idx_auto: word
  # 하이라이트 옵션
  highlight-option:
    pre_tags: <span class="sch_word">
    post_tags: </span>
    fragment_size: 300
    number_of_fragments: 5
  # 하이라이트 추가 필드 suffix 명칭
  highlight-add-field: _highlight
  # 정렬
  sort:
    Idx_08_menus:
      # 정확도 내림차순
      10: _score:DESC
      # 최신순 내림차순 - 해당 사이트는 등록일 기준(사이트 별 수정 가능)
      20: menu_cd:ASC
    idx_02_boards:
      # 정확도 내림차순
      10: _score:DESC
      # 최신순 내림차순 - 해당 사이트는 등록일 기준(사이트 별 수정 가능)
      20: upd_dtm:DESC
      # 최신순 오름차순 - 해당 사이트는 등록일 기준(사이트 별 수정 가능)
      21: upd_dtm:ASC
    idx_02_notices:
      # 정확도 내림차순
      10: _score:DESC
      # 최신순 내림차순 - 해당 사이트는 등록일 기준(사이트 별 수정 가능)
      20: upd_dtm:DESC
      # 최신순 오름차순 - 해당 사이트는 등록일 기준(사이트 별 수정 가능)
      21: upd_dtm:ASC
    idx_02_files:
      10: _score:DESC
      # 최신순 내림차순 - 해당 사이트는 등록일 기준(사이트 별 수정 가능)
      20: upd_dtm:DESC
      # 최신순 오름차순 - 해당 사이트는 등록일 기준(사이트 별 수정 가능)
      21: upd_dtm:ASC
    idx_auto:
      # 정확도 내림차순
      10: _score:DESC
      # 해당 기능없음, 정확도와 동일하게 제공. 고객이 원한다면 필드변경 가능
      20: _score:DESC
      # 해당 기능없음, 정확도와 동일하게 제공. 고객이 원한다면 필드변경 가능
      21: _score:DESC
  # 첨부파일 확장자 조건 - 상세검색에서 사용되며, ATTACHED99의 경우 기타(ATTACHED01~ATTACHED06 을 제외한 대상 조건검색하기 위한 필드)
  attached:
    ATTACHED99: hwp,hwpx,doc,docx,hwdt,ppt,pptx,show,xls,xlsx,cell,pdf,txt
    ATTACHED01: hwp,hwpx
    ATTACHED02: doc,docx,hwdt
    ATTACHED03: ppt,pptx,show
    ATTACHED04: xls,xlsx,cell
    ATTACHED05: pdf
    ATTACHED06: txt

  # 어그리게이션 결과 수 최대 카운트
  aggs-max-count: 1000

  # 어그리게이션 정보 : 인덱스별로 사용한 어그리게이션의 필드, 필드명, 정렬 정보를 지정(field, name, sort는 각 값들의 갯수가 같아야 한다.)
  aggs:
    idx_01_edms:
      field: reg_year,attach_info.attach_ext
      name: 년도,확장자
      sort: _key:desc,_key:asc
    idx_02_eapproval:
      field: reg_year,attach_info.attach_ext
      name: 년도,확장자
      sort: _key:desc,_key:asc
    idx_02_boards:
      field: reg_year,attach_info.attach_ext
      name: 년도,확장자
      sort: _key:desc,_key:asc
    idx_02_document:
      field: reg_year,attach_info.attach_ext
      name: 년도,확장자
      sort: _key:desc,_key:asc
    #어그리게이션 없음, 생긴다면 아래필드 활용
    idx_03_people:
      field:
      name:
      sort:
    #어그리게이션 없음, 생긴다면 아래필드 활용
    idx_auto:
      field:
      name:
      sort:
  # 권한 조건 사용 인덱스
  #acl-indices: idx_02_eapproval,idx_02_boards,idx_02_document
  acl-indices:
  # 검색조건 필드 : date, ext는 상세검색 시 사용되며, acl_01,acl_02는 권한조건 추가 시 사용된다.
  condition:
    idx_01_edms:
      dateyn: Y
      date: reg_dtm
      extyn: Y
      ext: attach_info.attach_ext
      acl01yn: N
      acl01:
      acl02yn: N
      acl02:
    idx_02_eapproval:
      dateyn: Y
      date: reg_dtm
      extyn: Y
      ext: attach_info.attach_ext
      acl01yn: N
      acl01:
      acl02yn: N
      acl02:
    idx_02_boards:
      dateyn: Y
      date: reg_dtm
      extyn: Y
      ext: attach_info.attach_ext
      acl01yn: N
      acl01:
      acl02yn: N
      acl02:
    idx_02_document:
      dateyn: Y
      date: reg_dtm
      extyn: Y
      ext: attach_info.attach_ext
      acl01yn: N
      acl01:
      acl02yn: N
      acl02:
    idx_03_people:
      dateyn: N
      date:
      extyn: N
      ext:
      acl01yn: N
      acl01:
      acl02yn: N
      acl02:
    idx_auto:
      dateyn: N
      date:
      extyn: N
      ext:
      acl01yn: N
      acl01:
      acl02yn: N
      acl02:
  # 검색어 옵션 :
  query-option:
    type: best_fields
    operator: and
  query-phrase-option:
    type: phrase
    boost: 2
    slop: 3
  # 레인지 검색 옵션 : 현재 날짜 포맷만 존재함(gte, lte는 고정으로 사용)
  range-option:
    dateformat: strict_date_optional_time
  # 본문(첨부추출)내용 제한 사이즈
  content-max-size: 400
  # 인기검색어 스케줄러  - all: 전체, db: db에서만 조회, es: 검색엔진에서만 조회
  popular:
    scheduler-use: N
    scheduler-type: all
    # "0 0 1,13 * * ?" -> 새벽 1시 , 오후 1시 수행
    scheduler-cron: "0 * * * * ?"
    es:
      index: "/search-logs-*/_search"
      agg-name: top_keywords
      agg-field: keyword.keyword
      search-field: action.keyword
      search-value: SEARCH
      order-key: _count
      order-value: desc
      timezone: Asia/Seoul
      date-format: "yyyy-MM-dd'T'HH:mm:ss"
      range-field: timestamp
      size: 10
      period: 7
    db:
      size: 10
      period: 7
