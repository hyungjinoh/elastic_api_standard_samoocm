    #      # 최신순 내림차순 - 해당 사이트에서는 조직정보의 최신순 내림차순의 정의가 없기 때문에 정확도로 고정(사이트 별 수정 가능, 입사일 등으로 수정 가능)
    #      20: _score:DESC
    #      # 최신순 오름차순 - 해당 사이트에서는 조직정보의 최신순 오름차순의 정의가 없기 때문에 정확도로 고정(사이트 별 수정 가능, 입사일 등으로 수정 가능)
    #      21: _score:DESC
    #    idx_auto:
    #      # 정확도 내림차순
    #      10: _score:DESC
    #      # 해당 기능없음, 정확도와 동일하게 제공. 고객이 원한다면 필드변경 가능
    #      20: _score:DESC
    #      # 해당 기능없음, 정확도와 동일하게 제공. 고객이 원한다면 필드변경 가능
    #      21: _score:DESC
    #    idx_09_menus:
    #      # 정확도 내림차순 (메뉴 검색은 title 필드만 대상이라 정확도 정렬만 사용)
    #      10: _score:DESC
    #      20: _score:DESC
    #      21: _score:DESC
    # [우장각 커스텀] 10=정확도순, 20/21=최신순(작성일=modDate 기준), 30/31=가나다순(title).
    # 40(조회수순)/50(추천순)은 우장각 스키마에 해당 필드가 없어 정확도로 대체(향후 필드 추가 시 수정).
    idx_wjg_documents1:
      10: _score:DESC
      20: modDate:DESC
      21: modDate:ASC
      30: title.keyword:ASC
      31: title.keyword:DESC
      40: _score:DESC
      41: _score:DESC
      50: _score:DESC
      51: _score:DESC
    idx_wjg_documents2:
      10: _score:DESC
      20: modDate:DESC
      21: modDate:ASC
      30: title.keyword:ASC
      31: title.keyword:DESC
      40: _score:DESC
      41: _score:DESC
      50: _score:DESC
      51: _score:DESC
    idx_wjg_documents3:
