  # 검색어 옵션 :
  query-option:
    type: best_fields
    operator: and
  query-phrase-option:
    type: phrase
    boost: 2
    slop: 3
  # 레인지 검색 옵션 : 현재 날짜 포맷만 존재함(gte, lte는 고정으로 사용)
  range-option:
    dateformat: strict_date_optional_time
  # 본문(첨부추출)내용 제한 사이즈
  content-max-size: 400
  # 인기검색어 스케줄러  - all: 전체, db: db에서만 조회, es: 검색엔진에서만 조회
  popular:
    scheduler-use: N
    scheduler-type: all
    # "0 0 1,13 * * ?" -> 새벽 1시 , 오후 1시 수행
    scheduler-cron: "0 * * * * ?"
    es:
      index: "/search-logs-*/_search"
      agg-name: top_keywords
      agg-field: keyword.keyword
      search-field: action.keyword
      search-value: SEARCH
      order-key: _count
      order-value: desc
      timezone: Asia/Seoul
      date-format: "yyyy-MM-dd'T'HH:mm:ss"
      range-field: timestamp
      size: 10
      period: 7
    db:
      size: 10
      period: 7
