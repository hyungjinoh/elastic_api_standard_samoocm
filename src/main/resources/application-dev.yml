#######################
# Elasticsearch
#######################
#elasticsearch:
#  host: 'https://10.214.122.94:9200'
elasticsearch:
  host: 'https://192.168.3.210:9200'
  # ===== [wjg-loader 병합 — com.rayful.elastic.api.loader.config.ElasticsearchProperties] =====
  # 위 host 는 표준 검색 플로우(WebClientHelper)와 공유한다 — 같은 ES 클러스터를 가리켜야 한다.
  # 아래 3개는 공식 Elasticsearch Java 클라이언트(색인/적재 전용) 인증에만 쓰인다.
  username: elastic
  password: ${ES_PASSWORD:elastic}
  trust-self-signed: true   # local 전용. dev/prod 는 정식 트러스트스토어(truststore-path) 권장.

#######################
# Webclient
#######################
webclient:
  max-connections: 100
  max-idle-time: 60
  max-life-time: 60
  pending-acquire-timeout: 5000
  pending-acquire-maxCount: -1
  evict-in-background: 30
  metrics: false
  # 3000 -> 10000
  connection-timeout: 10000
  # 3000 -> 15000
  response-timeout: 15000
  # 3000 -> 15000
  read-timeout: 15000
  # 3000 -> 15000
  write-timeout: 15000
  max-in-memory-size: 100
  #  ssl:
  #    key-store-path: file:/app/search_api/ssl/elasticjks
  #    # @search!
  #    key-store-pwd: ${KEY_STORE_PWD}
  #    # [고객사 변경] 은행 폐쇄망 전제(trust-self-signed: false, 정식 인증서 검증)에서
  #    # 일반 회사 환경으로 바뀌면서 local 과 동일하게 자체서명 인증서 허용으로 전환.
  #    trust-self-signed: true
  #    #header-id-pw: ENC(JlWuhVIe8FK+0FSTX36QMoCsrHB1756y)
  #    # M0dhdks1Z0JkS3pybVdpWVVXSFY6MWpLQktydkxTdHFQN2dSQTF3WU9CQQ==
  #    header-api-key: SVF5dk1Kd0I0YkZ4dDVLOC1KQjI6ZXNNSHY0WmxSbmVPeG9vZ2k2THd5dw==
  ssl:
    #key-store-path: ssl/elastic.jks
    # @search!
    #key-store-pwd: ENC(0Whq7L+cSk3iL67TMoLaRIQPV4OuTqbs)
    # elastic:elastic
    #header-id-pw: ENC(JlWuhVIe8FK+0FSTX36QMoCsrHB1756y)
    # M0dhdks1Z0JkS3pybVdpWVVXSFY6MWpLQktydkxTdHFQN2dSQTF3WU9CQQ==
    # [로컬 기동 수정] 위는 전부 주석 처리돼 있어서 표준 검색 플로우(WebClientHelper)가 ES에 인증 헤더를
    # 아예 안 보내고 있었다 — 그래서 로컬 ES(보안 활성화됨)가 "anonymous access is not allowed"(401)로 거부.
    # CommonServiceImpl 이 이 값을 "아이디:비밀번호" 평문으로 읽어서 자기가 직접 Base64 인코딩 해 Basic 인증
    # 헤더로 보낸다(ENC(...) 로 감쌀 필요 없음 — 감싸려면 JASYPT_ENCRYPTOR_PASSWORD 로 새로 암호화해야 함).
    # 아래는 로더(ElasticsearchConfig)가 이미 성공적으로 쓰고 있는 것과 동일한 elastic/ES_PASSWORD 계정 재사용.
    header-id-pw: elastic:${ES_PASSWORD:elastic}

    #    trust-self-signed: false            # 우회 안 씀 — 정식 검증 경로
    trust-self-signed: true            # 우회 사용
    # [버그 수정] CommonServiceImpl.search() 는 header-api-key 가 비어있지 않으면 무조건 그걸 우선
    # 써버리고(ApiKey 인증), 바로 위에서 고친 header-id-pw(Basic 인증)는 아예 거들떠보지도 않는다.
    # 여기 남아있던 값은 다른(원격) ES용 API Key 로, 이 로컬 ES에서는 유효하지 않아 401이 났다 —
    # docker/docker-compose.yml 의 컨테이너 배포 쪽도 똑같은 이유로 이 값을 빈 문자열로 덮어쓰고 있다
    # (WEBCLIENT_SSL_HEADER_API_KEY: ""). 로컬도 비워서 Basic 인증(elastic/elastic1234)으로 떨어지게 했다.
    header-api-key: ''

