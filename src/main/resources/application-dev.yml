    # [우장각 커스텀] 기간은 modDate(작성일=최근 수정일) 기준 range 필터.
    # 파일형식(이미지/캐드 등 8종)은 고정 ATTACHED01~06 체계로 못 담아 filterOption.fileType(terms) 로 대체 처리 -> extyn: N
    idx_wjg_documents1:
