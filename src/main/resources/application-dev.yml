      20: modDate:DESC
      21: modDate:ASC
      30: title.keyword:ASC
      31: title.keyword:DESC
      40: _score:DESC
      41: _score:DESC
      50: _score:DESC
      51: _score:DESC
    idx_wjg_documents4:
      10: _score:DESC
      20: modDate:DESC
      21: modDate:ASC
      30: title.keyword:ASC
      31: title.keyword:DESC
      40: _score:DESC
      41: _score:DESC
      50: _score:DESC
      51: _score:DESC
  # 첨부파일 확장자 조건 - 상세검색에서 사용되며, ATTACHED99의 경우 기타(ATTACHED01~ATTACHED06 을 제외한 대상 조건검색하기 위한 필드)
  attached:
    ATTACHED99: hwp,hwpx,doc,docx,hwdt,ppt,pptx,show,xls,xlsx,cell,pdf,txt
    ATTACHED01: hwp,hwpx
    ATTACHED02: doc,docx,hwdt
    ATTACHED03: ppt,pptx,show
    ATTACHED04: xls,xlsx,cell
    ATTACHED05: pdf
    ATTACHED06: txt

  # 어그리게이션 결과 수 최대 카운트
  aggs-max-count: 1000

  # 어그리게이션 정보 : 인덱스별로 사용한 어그리게이션의 필드, 필드명, 정렬 정보를 지정(field, name, sort는 각 값들의 갯수가 같아야 한다.)
  aggs:
    #    idx_02_boards:
    #      field: reg_year,attach_info.attach_ext
    #      name: 년도,확장자
    #      sort: _key:desc,_key:asc
    #    idx_02_document:
    #      field: reg_year,attach_info.attach_ext
    #      name: 년도,확장자
    #      sort: _key:desc,_key:asc
    #    #어그리게이션 없음, 생긴다면 아래필드 활용
    #    idx_08_menus:
    #      field:
    #      name:
    #      sort:
    #어그리게이션 없음, 생긴다면 아래필드 활용
    idx_auto:
      field:
      name:
      sort:
    # [우장각 커스텀] 사이드바 파셋: 표준폴더 분류 / 프로젝트 연도 / 표준폴더(4단계, 구 "폴더경로(3단계)")
    # [4차 리뷰 반영] pathLv3(3단계) → pathLv4(4단계)로 변경 — 색인 시점에 path 를 앞 4단계까지만
    # 잘라 저장해 둔 keyword 필드다(SampleDataLoader.truncatePathLevels() 참고).
    # 예: "우장각>프로젝트>표준폴더>2023년" ("프로젝트"와 연도 사이에 "표준폴더" 고정 폴더 1단계가 더 들어감).
    # 이 field/name/sort 목록에 이름만 추가하면, 기존 StandardSearchServiceImpl.getAggsOptionMap()이
    # 그대로 읽어서 terms 집계를 걸어주므로 Java 코드는 따로 안 건드려도 된다.
    # ※ 매핑이 바뀐 필드라 기존에 이미 떠 있는 인덱스에는 적용되지 않는다 — POST /api/index/recreate
    #   로 인덱스를 재생성하고 POST /api/index/sample 로 샘플 데이터를 다시 적재해야 한다.
    idx_wjg_documents1:
      field: standardFolder,projectYear,pathLv4
      name: 표준폴더분류,연도,표준폴더
      sort: _key:asc,_key:desc,_key:asc
    idx_wjg_documents2:
      field: standardFolder,projectYear,pathLv4
      name: 표준폴더분류,연도,표준폴더
      sort: _key:asc,_key:desc,_key:asc
    idx_wjg_documents3:
      field: standardFolder,projectYear,pathLv4
      name: 표준폴더분류,연도,표준폴더
      sort: _key:asc,_key:desc,_key:asc
    idx_wjg_documents4:
      field: standardFolder,projectYear,pathLv4
      name: 표준폴더분류,연도,표준폴더
      sort: _key:asc,_key:desc,_key:asc
  # 권한 조건 사용 인덱스
  #acl-indices: idx_02_eapproval,idx_02_boards,idx_02_document
  acl-indices:
  # 검색조건 필드 : date, ext는 상세검색 시 사용되며, acl_01,acl_02는 권한조건 추가 시 사용된다.
